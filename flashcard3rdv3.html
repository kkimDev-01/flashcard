<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2a2a2a">
  <title>단어장</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; transition: background-color 0.3s, color 0.3s; overflow: hidden; }
    body.light { background-color: #f5f5f5; color: #333; }
    body.dark { background-color: #1a1a1a; color: #e0e0e0; }
    .header { position: fixed; top: 0; left: 0; right: 0; height: auto; display: flex; flex-direction: column; justify-content: center; padding: 10px 15px; z-index: 100; transition: height 0.3s; }
    body.light .header { background-color: #fff; border-bottom: 1px solid #e0e0e0; }
    body.dark .header { background-color: #2a2a2a; border-bottom: 1px solid #444; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .header-top-right { display: flex; gap: 8px; }
    .header-selectors { display: flex; gap: 8px; align-items: center; overflow: hidden; transition: max-height 0.3s, opacity 0.3s; }
    .header-selectors.collapsed { max-height: 0; opacity: 0; margin: 0; }
    .header-selectors.expanded { max-height: 200px; opacity: 1; margin-bottom: 8px; }
    .selector-toggle { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: transform 0.3s; }
    body.light .selector-toggle { background-color: #2196f3; color: #fff; }
    body.dark .selector-toggle { background-color: #2196f3; color: #fff; }
    .selector-toggle.collapsed { transform: rotate(180deg); }
    .hamburger { width: 30px; height: 30px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-around; padding: 5px 0; }
    .hamburger span { display: block; height: 3px; background-color: currentColor; border-radius: 2px; }
    .filter-selector { flex: 1; padding: 8px 12px; border: 1px solid; border-radius: 8px; font-size: 14px; min-width: 0; }
    body.light .filter-selector { background-color: #f9f9f9; border-color: #ddd; color: #333; }
    body.dark .filter-selector { background-color: #333; border-color: #555; color: #e0e0e0; }
    .title-mode-toggle { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 14px; font-weight: bold; flex-shrink: 0; }
    body.light .title-mode-toggle { background-color: #2196f3; color: #fff; }
    body.dark .title-mode-toggle { background-color: #2196f3; color: #fff; }
    .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; flex-shrink: 0; }
    body.light .theme-toggle { background-color: #333; color: #fff; }
    body.dark .theme-toggle { background-color: #fff; color: #333; }
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; z-index: 200; transition: left 0.3s; padding: 20px; overflow-y: auto; }
    body.light .sidebar { background-color: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
    body.dark .sidebar { background-color: #2a2a2a; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
    .sidebar.open { left: 0; }
    .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); z-index: 150; display: none; }
    .sidebar-overlay.show { display: block; }
    .sidebar-item { padding: 15px 10px; margin: 5px 0; cursor: pointer; border-radius: 8px; }
    body.light .sidebar-item:hover { background-color: #f0f0f0; }
    body.dark .sidebar-item:hover { background-color: #3a3a3a; }
    .container { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 20px; transition: top 0.3s; }
    .container.with-selectors { top: 100px; }
    .container.without-selectors { top: 60px; }
    .card { width: 100%; max-width: 600px; height: 100%; position: relative; perspective: 1000px; display: flex; flex-direction: column; }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; flex: 1; display: flex; cursor: pointer; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-inner.editing { cursor: default; }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    body.light .card-face { background-color: #fff; }
    body.dark .card-face { background-color: #2a2a2a; }
    .card-back { transform: rotateY(180deg); }
    body.light .card-back { background-color: #fff; }
    body.dark .card-back { background-color: #2a2a2a; }
    .card-title { padding: 20px; padding-right: 80px; font-size: 18px; font-weight: 500; text-align: center; border-bottom: 1px solid; position: relative; flex-shrink: 0; min-height: 70px; display: flex; align-items: center; justify-content: center; gap: 10px; line-height: 1.4; word-break: keep-all; }
    body.light .card-title { border-color: #e0e0e0; }
    body.dark .card-title { border-color: #444; }
    .card-title.size-small { font-size: 13px; }
    .card-title.size-medium { font-size: 15px; }
    .card-title.size-large { font-size: 18px; }
    .appendix-badge { font-size: 14px; font-weight: 500; padding: 4px 8px; border-radius: 4px; background-color: #ffd700; color: #333; }
    .card-counter { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.7; white-space: nowrap; }
    .card-content { 
      flex: 1 1 auto; 
      padding: 30px; 
      overflow-y: scroll !important; 
      overflow-x: hidden; 
      font-size: 16px; 
      line-height: 1.8; 
      white-space: pre-wrap; 
      word-wrap: break-word; 
      min-height: 0;
      max-height: 100%;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: auto;
      position: relative;
    }
    .card-content::-webkit-scrollbar { width: 8px; }
    .card-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
    .card-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); border-radius: 4px; }
    .card-content.editing { padding: 15px; }
    .edit-textarea { width: 100%; height: 100%; padding: 15px; border: 2px solid #ffd700; border-radius: 8px; font-size: 16px; line-height: 1.8; resize: none; font-family: inherit; }
    body.light .edit-textarea { background-color: #fffef5; color: #333; }
    body.dark .edit-textarea { background-color: #2a2a14; color: #e0e0e0; }
    .edit-buttons { display: flex; gap: 10px; padding: 15px; justify-content: center; border-top: 2px solid #ffd700; flex-shrink: 0; }
    .edit-btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .edit-btn.save { background-color: #4caf50; color: #fff; }
    .edit-btn.cancel { background-color: #f44336; color: #fff; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-top: 1px solid; flex-shrink: 0; min-height: 70px; }
    body.light .card-footer { border-color: #e0e0e0; }
    body.dark .card-footer { border-color: #444; }
    .week-status { font-size: 14px; font-weight: 500; padding: 4px 8px; border-radius: 4px; }
    .week-status.read { color: #4caf50; background-color: rgba(76, 175, 80, 0.1); }
    .week-status.unread { color: #f44336; background-color: rgba(244, 67, 54, 0.1); }
    .action-buttons { display: flex; gap: 15px; }
    .action-btn { width: 40px; height: 40px; border: 2px solid transparent; border-radius: 50%; cursor: pointer; font-size: 20px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
    body.light .action-btn { background-color: #f5f5f5; color: #666; }
    body.dark .action-btn { background-color: #3a3a3a; color: #aaa; }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.active { background-color: #ff9800; color: #fff; border-color: #ff9800; }
    .action-btn.has-comment { background-color: #2196f3; color: #fff; border-color: #2196f3; }
    .action-btn.has-bookmark { background-color: #ffd700; color: #333; border-color: #ffd700; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; align-items: center; justify-content: center; background-color: rgba(0,0,0,0.5); }
    .modal.show { display: flex; }
    .modal-content { width: 90%; max-width: 500px; max-height: 80vh; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    body.light .modal-content { background-color: #fff; }
    body.dark .modal-content { background-color: #2a2a2a; }
    .modal-header { padding: 20px; font-size: 18px; font-weight: 500; border-bottom: 1px solid; }
    body.light .modal-header { border-color: #e0e0e0; }
    body.dark .modal-header { border-color: #444; }
    .modal-body { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-footer { padding: 15px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid; }
    body.light .modal-footer { border-color: #e0e0e0; }
    body.dark .modal-footer { border-color: #444; }
    .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .modal-btn.primary { background-color: #2196f3; color: #fff; }
    body.light .modal-btn.secondary { background-color: #f5f5f5; color: #666; }
    body.dark .modal-btn.secondary { background-color: #3a3a3a; color: #aaa; }
    textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid; border-radius: 8px; font-size: 14px; resize: vertical; font-family: inherit; }
    body.light textarea { background-color: #f9f9f9; border-color: #ddd; color: #333; }
    body.dark textarea { background-color: #333; border-color: #555; color: #e0e0e0; }
    .comment-item { padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; }
    body.light .comment-item { background-color: #f9f9f9; }
    body.dark .comment-item { background-color: #333; }
    .comment-text { flex: 1; white-space: pre-wrap; line-height: 1.5; }
    .delete-btn { padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; margin-left: 10px; background-color: #f44336; color: #fff; }
    .stats-table { width: 100%; border-collapse: collapse; }
    .stats-table th, .stats-table td { padding: 12px; text-align: left; border-bottom: 1px solid; }
    body.light .stats-table th, body.light .stats-table td { border-color: #e0e0e0; }
    body.dark .stats-table th, body.dark .stats-table td { border-color: #444; }
    .loading { text-align: center; padding: 40px; font-size: 18px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px 12px; border: 1px solid; border-radius: 8px; font-size: 14px; margin: 10px 0; }
    body.light input[type="text"], body.light input[type="file"] { background-color: #f9f9f9; border-color: #ddd; color: #333; }
    body.dark input[type="text"], body.dark input[type="file"] { background-color: #333; border-color: #555; color: #e0e0e0; }
    .checkbox-item { padding: 10px; margin: 5px 0; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 6px; }
    .no-data { text-align: center; padding: 40px; color: #999; }
    .page-container { padding: 20px; overflow-y: auto; height: 100%; }
    .import-section { margin: 20px 0; }
    .import-label { display: block; margin: 15px 0 5px; font-weight: 500; }
    .bookmark-item-container { display: flex; align-items: center; justify-content: space-between; padding: 15px 10px; margin: 5px 0; cursor: pointer; border-radius: 8px; }
    .bookmark-item-name { flex: 1; }
    .bookmark-item-buttons { display: flex; gap: 8px; }
    .bookmark-edit-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background-color: #2196f3; color: #fff; }
    .bookmark-edit-btn:hover { background-color: #1976d2; }
    .bookmark-delete-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; background-color: #f44336; color: #fff; }
    .bookmark-delete-btn:hover { background-color: #d32f2f; }
    .stat-unit-selector { width: 100%; padding: 10px; border: 1px solid; border-radius: 8px; font-size: 14px; margin-bottom: 20px; }
    body.light .stat-unit-selector { background-color: #f9f9f9; border-color: #ddd; color: #333; }
    body.dark .stat-unit-selector { background-color: #333; border-color: #555; color: #e0e0e0; }
    .image-move-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background-color: #4caf50; color: #fff; }
    .image-move-btn:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body class="dark">
  <div class="header">
    <div class="header-top">
      <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
      <div class="header-top-right">
        <button class="selector-toggle" id="selectorToggle" onclick="toggleSelectors()">▲</button>
        <button class="title-mode-toggle" onclick="toggleTitleMode()" id="titleModeBtn">名</button>
        <button class="theme-toggle" onclick="toggleTheme()">☀️</button>
      </div>
    </div>
    <div class="header-selectors expanded" id="headerSelectors">
      <select class="filter-selector" id="partSelector" onchange="onFilterChange()"><option value="">전체 Part</option></select>
      <select class="filter-selector" id="chapterSelector" onchange="onFilterChange()"><option value="">전체 Chapter</option></select>
      <select class="filter-selector" id="sectionSelector" onchange="onFilterChange()"><option value="">전체 Section</option></select>
      <select class="filter-selector" id="subSectionSelector" onchange="onFilterChange()"><option value="">전체 SubSection</option></select>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar">
    <div class="sidebar-item" onclick="goToMode('all')">전체 단어장</div>
    <div class="sidebar-item" onclick="goToMode('unread_today')">오늘 읽지 않은 단어장</div>
    <div class="sidebar-item" onclick="goToMode('unread_week')">이번주 읽지 않은 단어장</div>
    <div class="sidebar-item" onclick="goToMode('bookmark')">북마크</div>
    <div class="sidebar-item" onclick="goToMode('stats')">통계</div>
    <div class="sidebar-item" onclick="exportLocalStorage()">데이터 내보내기</div>
    <div class="sidebar-item" onclick="importLocalStorage()">데이터 가져오기</div>
    <div class="sidebar-item" onclick="showImportPage()">데이터 관리</div>
  </div>
  <div class="container with-selectors" id="mainContainer"><div class="loading">로딩 중...</div></div>
  <div class="modal" id="commentModal">
    <div class="modal-content">
      <div class="modal-header">댓글</div>
      <div class="modal-body"><div id="commentList"></div><textarea id="newComment" placeholder="댓글을 입력하세요..."></textarea></div>
      <div class="modal-footer"><button class="modal-btn secondary" onclick="closeCommentModal()">취소</button><button class="modal-btn primary" onclick="submitComment()">등록</button></div>
    </div>
  </div>
  <div class="modal" id="bookmarkModal">
    <div class="modal-content">
      <div class="modal-header">북마크 그룹</div>
      <div class="modal-body"><input type="text" id="newBookmarkGroup" placeholder="새 그룹 이름"><button class="modal-btn primary" onclick="addNewBookmarkGroup()" style="width:100%;margin-bottom:15px">그룹 추가</button><div id="bookmarkGroupList"></div></div>
      <div class="modal-footer"><button class="modal-btn secondary" onclick="closeBookmarkModal()">닫기</button></div>
    </div>
  </div>
  
  <div class="modal" id="renameBookmarkModal">
    <div class="modal-content">
      <div class="modal-header">북마크 그룹 이름 변경</div>
      <div class="modal-body">
        <input type="text" id="renameBookmarkInput" placeholder="그룹 이름">
      </div>
      <div class="modal-footer">
        <button class="modal-btn primary" onclick="confirmRenameBookmark()">확인</button>
        <button class="modal-btn secondary" onclick="closeRenameBookmarkModal()">취소</button>
      </div>
    </div>
  </div>
  
  <input type="file" id="localStorageImport" accept=".json" style="display:none" onchange="handleLocalStorageImport(this)">
  <input type="file" id="contentReplace" accept=".json" style="display:none" onchange="handleContentReplace(this)">
  <input type="file" id="contentMerge" accept=".json" style="display:none" onchange="handleContentMerge(this)">
  <input type="file" id="partImport" accept=".json" style="display:none" onchange="handlePartImport(this)">
  <input type="file" id="chapterImport" accept=".json" style="display:none" onchange="handleChapterImport(this)">
  <input type="file" id="sectionImport" accept=".json" style="display:none" onchange="handleSectionImport(this)">
  <input type="file" id="appendixImport" accept=".json" style="display:none" onchange="handleAppendixImport(this)">

<script>
// ============ 데이터 정의 ============
const STORAGE_PREFIX = 'flashcard_v2_'; // 다른 단어장과 구분하기 위한 prefix
let PART_LIST = [];
let CHAPTER_LIST = [];
let SECTION_LIST = [];
let CONTENTS = [];
let APPENDIX_LIST = [];

// localStorage에서 저장된 데이터 불러오기
function loadSavedData() {
  const savedPartList = localStorage.getItem(STORAGE_PREFIX + 'part_list');
  const savedChapterList = localStorage.getItem(STORAGE_PREFIX + 'chapter_list');
  const savedSectionList = localStorage.getItem(STORAGE_PREFIX + 'section_list');
  const savedContents = localStorage.getItem(STORAGE_PREFIX + 'contents');
  const savedAppendixList = localStorage.getItem(STORAGE_PREFIX + 'appendix_list');
  
  if (savedPartList) {
    try {
      PART_LIST = JSON.parse(savedPartList);
    } catch (e) {
      console.error('PartList 로드 실패:', e);
    }
  }
  
  if (savedChapterList) {
    try {
      CHAPTER_LIST = JSON.parse(savedChapterList);
    } catch (e) {
      console.error('ChapterList 로드 실패:', e);
    }
  }
  
  if (savedSectionList) {
    try {
      SECTION_LIST = JSON.parse(savedSectionList);
    } catch (e) {
      console.error('SectionList 로드 실패:', e);
    }
  }
  
  if (savedContents) {
    try {
      CONTENTS = JSON.parse(savedContents);
    } catch (e) {
      console.error('Contents 로드 실패:', e);
    }
  }
  
  if (savedAppendixList) {
    try {
      APPENDIX_LIST = JSON.parse(savedAppendixList);
    } catch (e) {
      console.error('AppendixList 로드 실패:', e);
    }
  }
  
  // 저장된 데이터가 없으면 초기 데이터 사용
  if (PART_LIST.length === 0) {
    PART_LIST = [
      { sequence: 1, part: "I", name: "파트 1" },
      { sequence: 2, part: "II", name: "파트2" }
    ];
  }
  
  if (CHAPTER_LIST.length === 0) {
    CHAPTER_LIST = [
      { sequence: 1, part: "I", chapter: 1, name: "챕터1" },
      { sequence: 2, part: "I", chapter: 2, name: "챕터2" },
      { sequence: 3, part: "I", chapter: 3, name: "챕터3" },
      { sequence: 4, part: "I", chapter: 4, name: "챕터4" },
      { sequence: 5, part: "II", chapter: 1, name: "챕터1" }
    ];
  }
  
  if (SECTION_LIST.length === 0) {
    SECTION_LIST = [
      { sequence: 1, part: "I", chapter: 1, section: 1, name: "섹션1" },
      { sequence: 2, part: "I", chapter: 1, section: 2, name: "섹션2" },
      { sequence: 3, part: "II", chapter: 1, section: 1, name: "섹션1" },
      { sequence: 4, part: "II", chapter: 1, section: 2, name: "섹션2" }
    ];
  }
  
  if (CONTENTS.length === 0) {
    CONTENTS = [
      { sequence: 1, part: "I", chapter: 1, section: 1, subSection: "가", content: "내용1\n내용이 여러줄 있을 수 있습니다.", page: "13" },
      { sequence: 2, part: "I", chapter: 1, section: 1, subSection: "나", content: "내용2", page: "13" },
      { sequence: 3, part: "II", chapter: 1, section: 1, subSection: "가", content: "내용3", page: "25" },
      { sequence: 4, part: "II", chapter: 1, section: 1, subSection: "나", content: "내용4", page: "25" }
    ];
  }
  
  if (APPENDIX_LIST.length === 0) {
    APPENDIX_LIST = [
      { sequence: 1, part: "I", chapter: 1, section: 1, subSection: "가", appendix: "부록 내용1" },
      { sequence: 2, part: "I", chapter: 1, section: 1, subSection: "나", appendix: "부록 내용2" },
      { sequence: 3, part: "II", chapter: 1, section: 1, subSection: "가", appendix: "부록 내용3" },
      { sequence: 4, part: "II", chapter: 1, section: 1, subSection: "나", appendix: "부록 내용4" }
    ];
  }
}

// 초기 로드
loadSavedData();

// ============ 상태 관리 ============
let currentMode = 'all';
let currentPartFilter = '';
let currentChapterFilter = '';
let currentSectionFilter = '';
let currentSubSectionFilter = '';
let currentBookmarkGroup = '';
let titleMode = 'name'; // 'name' or 'id'
let filteredContents = [];
let currentIndex = 0;
let currentContent = null;
let isFlipped = false;
let isEditingAppendix = false;
let originalAppendix = '';
let selectorsExpanded = true;

// ============ localStorage 헬퍼 함수 ============
const storage = {
  getComments: (part, chapter, section, subSection) => {
    const key = STORAGE_PREFIX + `comment_${part}_${chapter}_${section}_${subSection}`;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : [];
  },
  addComment: (part, chapter, section, subSection, text) => {
    const key = STORAGE_PREFIX + `comment_${part}_${chapter}_${section}_${subSection}`;
    const comments = storage.getComments(part, chapter, section, subSection);
    comments.push({id: Date.now(), text, created: new Date().toISOString()});
    localStorage.setItem(key, JSON.stringify(comments));
  },
  deleteComment: (part, chapter, section, subSection, id) => {
    const key = STORAGE_PREFIX + `comment_${part}_${chapter}_${section}_${subSection}`;
    const comments = storage.getComments(part, chapter, section, subSection).filter(c => c.id !== id);
    localStorage.setItem(key, JSON.stringify(comments));
  },
  getBookmarkGroups: () => {
    const data = localStorage.getItem(STORAGE_PREFIX + 'bookmark_groups');
    return data ? JSON.parse(data) : [];
  },
  addBookmarkGroup: (groupName) => {
    const groups = storage.getBookmarkGroups();
    if (!groups.includes(groupName)) {
      groups.push(groupName);
      localStorage.setItem(STORAGE_PREFIX + 'bookmark_groups', JSON.stringify(groups));
    }
  },
  getBookmarks: (groupName) => {
    const key = STORAGE_PREFIX + `bookmark_${groupName}`;
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : [];
  },
  addBookmark: (groupName, part, chapter, section, subSection) => {
    storage.addBookmarkGroup(groupName);
    const key = STORAGE_PREFIX + `bookmark_${groupName}`;
    const bookmarks = storage.getBookmarks(groupName);
    const exists = bookmarks.some(b => b.part === part && b.chapter === chapter && b.section === section && b.subSection === subSection);
    if (!exists) {
      bookmarks.push({part, chapter, section, subSection});
      localStorage.setItem(key, JSON.stringify(bookmarks));
    }
  },
  removeBookmark: (groupName, part, chapter, section, subSection) => {
    const key = STORAGE_PREFIX + `bookmark_${groupName}`;
    const bookmarks = storage.getBookmarks(groupName).filter(b => 
      !(b.part === part && b.chapter === chapter && b.section === section && b.subSection === subSection)
    );
    localStorage.setItem(key, JSON.stringify(bookmarks));
  },
  isBookmarked: (part, chapter, section, subSection) => {
    const groups = storage.getBookmarkGroups();
    return groups.filter(g => {
      const bookmarks = storage.getBookmarks(g);
      return bookmarks.some(b => b.part === part && b.chapter === chapter && b.section === section && b.subSection === subSection);
    });
  },
  getAppendix: (part, chapter, section, subSection) => {
    const appendixItem = APPENDIX_LIST.find(a => 
      a.part === part && a.chapter == chapter && a.section == section && a.subSection === subSection
    );
    return appendixItem ? appendixItem.appendix : '';
  },
  saveAppendix: (part, chapter, section, subSection, text) => {
    const index = APPENDIX_LIST.findIndex(a => 
      a.part === part && a.chapter == chapter && a.section == section && a.subSection === subSection
    );
    if (index !== -1) {
      APPENDIX_LIST[index].appendix = text;
    } else {
      APPENDIX_LIST.push({ sequence: APPENDIX_LIST.length + 1, part, chapter, section, subSection, appendix: text });
    }
    localStorage.setItem(STORAGE_PREFIX + 'appendix_list', JSON.stringify(APPENDIX_LIST));
  },
  isReadToday: (part, chapter, section, subSection) => {
    const key = STORAGE_PREFIX + `read_${part}_${chapter}_${section}_${subSection}`;
    const data = localStorage.getItem(key);
    if (!data) return false;
    const readDate = new Date(data);
    const today = new Date();
    return readDate.toDateString() === today.toDateString();
  },
  isReadThisWeek: (part, chapter, section, subSection) => {
    const key = STORAGE_PREFIX + `read_${part}_${chapter}_${section}_${subSection}`;
    const data = localStorage.getItem(key);
    if (!data) return false;
    const readDate = new Date(data);
    const now = new Date();
    const dayOfWeek = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
    monday.setHours(0, 0, 0, 0);
    return readDate >= monday;
  },
  toggleRead: (part, chapter, section, subSection) => {
    const key = STORAGE_PREFIX + `read_${part}_${chapter}_${section}_${subSection}`;
    if (storage.isReadToday(part, chapter, section, subSection)) {
      localStorage.removeItem(key);
      return false;
    } else {
      localStorage.setItem(key, new Date().toISOString());
      return true;
    }
  },
  renameBookmarkGroup: (oldName, newName) => {
    const groups = storage.getBookmarkGroups();
    const index = groups.indexOf(oldName);
    if (index !== -1) {
      groups[index] = newName;
      localStorage.setItem(STORAGE_PREFIX + 'bookmark_groups', JSON.stringify(groups));
    }
    
    const oldKey = STORAGE_PREFIX + `bookmark_${oldName}`;
    const newKey = STORAGE_PREFIX + `bookmark_${newName}`;
    const bookmarks = localStorage.getItem(oldKey);
    if (bookmarks) {
      localStorage.setItem(newKey, bookmarks);
      localStorage.removeItem(oldKey);
    }
  },
  deleteBookmarkGroup: (groupName) => {
    const groups = storage.getBookmarkGroups().filter(g => g !== groupName);
    localStorage.setItem(STORAGE_PREFIX + 'bookmark_groups', JSON.stringify(groups));
    localStorage.removeItem(STORAGE_PREFIX + `bookmark_${groupName}`);
  },
  reorderBookmarkGroups: (fromIndex, toIndex) => {
    const groups = storage.getBookmarkGroups();
    const [removed] = groups.splice(fromIndex, 1);
    groups.splice(toIndex, 0, removed);
    localStorage.setItem(STORAGE_PREFIX + 'bookmark_groups', JSON.stringify(groups));
  }
};

function toggleSelectors() {

function exportLocalStorage() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(STORAGE_PREFIX)) {
      data[key] = localStorage.getItem(key);
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `flashcard_data_${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('데이터가 내보내기되었습니다!');
  toggleSidebar();
}

function handleLocalStorageImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (confirm('기존 localStorage 데이터를 모두 삭제하고 가져오시겠습니까?')) {
        // STORAGE_PREFIX로 시작하는 키만 삭제
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith(STORAGE_PREFIX)) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
        
        Object.keys(data).forEach(key => localStorage.setItem(key, data[key]));
        alert('데이터 가져오기 완료!');
        toggleSidebar();
        location.reload();
      }
    } catch (err) {
      alert('잘못된 파일 형식입니다.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ============ 초기화 ============
function init() {
  const theme = localStorage.getItem(STORAGE_PREFIX + 'theme') || 'dark';
  document.body.className = theme;
  document.querySelector('.theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  
  titleMode = localStorage.getItem(STORAGE_PREFIX + 'titleMode') || 'name';
  document.getElementById('titleModeBtn').textContent = titleMode === 'name' ? '名' : '#';
  
  updateSelectors();
  goToMode('all');
}

function updateSelectors() {
  updatePartSelector();
  updateChapterSelector();
  updateSectionSelector();
  updateSubSectionSelector();
}

function updatePartSelector() {
  const selector = document.getElementById('partSelector');
  const currentValue = selector.value;
  selector.innerHTML = '<option value="">전체 Part</option>';
  
  PART_LIST.forEach(part => {
    const option = document.createElement('option');
    option.value = part.part;
    option.textContent = `${part.part} - ${part.name}`;
    selector.appendChild(option);
  });
  
  if (currentValue && PART_LIST.some(p => p.part === currentValue)) {
    selector.value = currentValue;
  }
}

function updateChapterSelector() {
  const selector = document.getElementById('chapterSelector');
  const currentValue = selector.value;
  selector.innerHTML = '<option value="">전체 Chapter</option>';
  
  let chapters = CHAPTER_LIST;
  if (currentPartFilter) {
    chapters = chapters.filter(c => c.part === currentPartFilter);
  }
  
  chapters.forEach(chapter => {
    const option = document.createElement('option');
    option.value = chapter.chapter;
    option.textContent = `${chapter.chapter} - ${chapter.name}`;
    selector.appendChild(option);
  });
  
  if (currentValue && chapters.some(c => c.chapter == currentValue)) {
    selector.value = currentValue;
  } else if (!chapters.some(c => c.chapter == currentValue)) {
    currentChapterFilter = '';
  }
}

function updateSectionSelector() {
  const selector = document.getElementById('sectionSelector');
  const currentValue = selector.value;
  selector.innerHTML = '<option value="">전체 Section</option>';
  
  let sections = SECTION_LIST;
  if (currentPartFilter) {
    sections = sections.filter(s => s.part === currentPartFilter);
  }
  if (currentChapterFilter) {
    sections = sections.filter(s => s.chapter == currentChapterFilter);
  }
  
  sections.forEach(section => {
    const option = document.createElement('option');
    option.value = section.section;
    option.textContent = `${section.section} - ${section.name}`;
    selector.appendChild(option);
  });
  
  if (currentValue && sections.some(s => s.section == currentValue)) {
    selector.value = currentValue;
  } else if (!sections.some(s => s.section == currentValue)) {
    currentSectionFilter = '';
  }
}

function updateSubSectionSelector() {
  const selector = document.getElementById('subSectionSelector');
  const currentValue = selector.value;
  selector.innerHTML = '<option value="">전체 SubSection</option>';
  
  let contents = CONTENTS;
  if (currentPartFilter) {
    contents = contents.filter(c => c.part === currentPartFilter);
  }
  if (currentChapterFilter) {
    contents = contents.filter(c => c.chapter == currentChapterFilter);
  }
  if (currentSectionFilter) {
    contents = contents.filter(c => c.section == currentSectionFilter);
  }
  
  const uniqueSubSections = [...new Set(contents.map(c => c.subSection))].sort();
  uniqueSubSections.forEach(subSection => {
    const option = document.createElement('option');
    option.value = subSection;
    option.textContent = subSection;
    selector.appendChild(option);
  });
  
  if (currentValue && uniqueSubSections.includes(currentValue)) {
    selector.value = currentValue;
  } else if (!uniqueSubSections.includes(currentValue)) {
    currentSubSectionFilter = '';
  }
}

function onFilterChange() {
  currentPartFilter = document.getElementById('partSelector').value;
  const oldChapterFilter = currentChapterFilter;
  const oldSectionFilter = currentSectionFilter;
  const oldSubSectionFilter = currentSubSectionFilter;
  
  currentChapterFilter = document.getElementById('chapterSelector').value;
  currentSectionFilter = document.getElementById('sectionSelector').value;
  currentSubSectionFilter = document.getElementById('subSectionSelector').value;
  
  if (currentPartFilter !== oldChapterFilter) {
    updateChapterSelector();
    updateSectionSelector();
    updateSubSectionSelector();
  } else if (currentChapterFilter !== oldSectionFilter) {
    updateSectionSelector();
    updateSubSectionSelector();
  } else if (currentSectionFilter !== oldSubSectionFilter) {
    updateSubSectionSelector();
  }
  
  applyFilters();
}

// ============ 모드 전환 ============
function goToMode(mode) {
  currentMode = mode;
  currentBookmarkGroup = '';
  toggleSidebar();
  
  if (mode === 'stats') {
    showStats();
  } else if (mode === 'bookmark') {
    showBookmarkGroups();
  } else {
    applyFilters();
  }
}

function applyFilters() {
  filteredContents = CONTENTS.filter(content => {
    if (currentPartFilter && content.part !== currentPartFilter) return false;
    if (currentChapterFilter && content.chapter != currentChapterFilter) return false;
    if (currentSectionFilter && content.section != currentSectionFilter) return false;
    if (currentSubSectionFilter && content.subSection !== currentSubSectionFilter) return false;
    
    if (currentMode === 'unread_today') {
      if (storage.isReadToday(content.part, content.chapter, content.section, content.subSection)) return false;
    }
    if (currentMode === 'unread_week') {
      if (storage.isReadThisWeek(content.part, content.chapter, content.section, content.subSection)) return false;
    }
    if (currentBookmarkGroup) {
      const bookmarks = storage.getBookmarks(currentBookmarkGroup);
      if (!bookmarks.some(b => b.part === content.part && b.chapter === content.chapter && b.section === content.section && b.subSection === content.subSection)) return false;
    }
    
    return true;
  });
  
  currentIndex = 0;
  renderCard();
}

// ============ 카드 렌더링 ============
function renderCard() {
  if (filteredContents.length === 0) {
    document.getElementById('mainContainer').innerHTML = '<div class="no-data">표시할 내용이 없습니다</div>';
    return;
  }
  
  currentContent = filteredContents[currentIndex];
  const {part, chapter, section, subSection} = currentContent;
  
  const partInfo = PART_LIST.find(p => p.part === part);
  const chapterInfo = CHAPTER_LIST.find(c => c.part === part && c.chapter == chapter);
  const sectionInfo = SECTION_LIST.find(s => s.part === part && s.chapter == chapter && s.section == section);
  
  let titleText = '';
  if (titleMode === 'id') {
    titleText = `${part}.${chapter}.${section}.${subSection}`;
  } else {
    const partName = partInfo ? partInfo.name : part;
    const chapterName = chapterInfo ? chapterInfo.name : `Chapter ${chapter}`;
    const sectionName = sectionInfo ? sectionInfo.name : `Section ${section}`;
    titleText = `${partName} > ${chapterName} > ${sectionName} > ${subSection}`;
  }
  
  if (currentContent.page) {
    titleText += ` (p.${currentContent.page})`;
  }
  
  // 제목 길이에 따라 글자 크기 결정
  let titleSizeClass = 'size-large';
  if (titleText.length > 80) {
    titleSizeClass = 'size-small';
  } else if (titleText.length > 50) {
    titleSizeClass = 'size-medium';
  }
  
  const appendix = storage.getAppendix(part, chapter, section, subSection);
  const hasAppendix = appendix && appendix.trim();
  
  const isReadWeek = storage.isReadThisWeek(part, chapter, section, subSection);
  const comments = storage.getComments(part, chapter, section, subSection);
  const bookmarkGroups = storage.isBookmarked(part, chapter, section, subSection);
  
  const html = `
    <div class="card">
      <div class="card-inner" id="cardInner" onclick="handleCardClick(event)">
        <div class="card-face">
          <div class="card-title ${titleSizeClass}">
            ${titleText}
            <span class="card-counter">${currentIndex + 1}/${filteredContents.length}</span>
          </div>
          <div class="card-content">${currentContent.content}</div>
          <div class="card-footer">
            <span class="week-status ${isReadWeek ? 'read' : 'unread'}">${isReadWeek ? '이번주 읽음' : '이번주 읽지 않음'}</span>
            <div class="action-buttons">
              <button class="action-btn ${comments.length > 0 ? 'has-comment' : ''}" onclick="event.stopPropagation(); openCommentModal()">💬</button>
              <button class="action-btn ${bookmarkGroups.length > 0 ? 'has-bookmark' : ''}" onclick="event.stopPropagation(); openBookmarkModal()">⭐</button>
              <button class="action-btn ${isReadWeek ? 'active' : ''}" onclick="event.stopPropagation(); toggleReadStatus()">✓</button>
            </div>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="card-title ${titleSizeClass}">
            ${titleText}
            <span class="appendix-badge">부록</span>
            <span class="card-counter">${currentIndex + 1}/${filteredContents.length}</span>
          </div>
          <div class="card-content" id="appendixContent">${appendix || '부록 내용이 없습니다'}</div>
          <div class="card-footer">
            <span></span>
            <button class="modal-btn primary" onclick="event.stopPropagation(); startEditAppendix()">편집</button>
          </div>
        </div>
      </div>
    </div>
  `;
  
  document.getElementById('mainContainer').innerHTML = html;
  isFlipped = false;
  isEditingAppendix = false;
  
  setupSwipeGesture();
}

function handleCardClick(event) {
  if (isEditingAppendix) return;
  if (event.target.closest('.action-btn') || event.target.closest('.modal-btn')) return;
  flipCard();
}

function setupSwipeGesture() {
  const card = document.querySelector('.card');
  if (!card) return;
  
  let startX = 0;
  let startY = 0;
  let endX = 0;
  let endY = 0;
  
  card.addEventListener('touchstart', (e) => {
    if (isEditingAppendix) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  
  card.addEventListener('touchmove', (e) => {
    if (isEditingAppendix) return;
    endX = e.touches[0].clientX;
    endY = e.touches[0].clientY;
  });
  
  card.addEventListener('touchend', () => {
    if (isEditingAppendix) return;
    const diffX = startX - endX;
    const diffY = Math.abs(startY - endY);
    
    if (Math.abs(diffX) > 50 && diffY < 100) {
      if (diffX > 0) {
        nextCard();
      } else {
        prevCard();
      }
    }
  });
}

function flipCard() {
  const cardInner = document.getElementById('cardInner');
  isFlipped = !isFlipped;
  if (isFlipped) {
    cardInner.classList.add('flipped');
  } else {
    cardInner.classList.remove('flipped');
  }
}

function nextCard() {
  if (currentIndex < filteredContents.length - 1) {
    currentIndex++;
    renderCard();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard();
  }
}

function startEditAppendix() {
  isEditingAppendix = true;
  const {part, chapter, section, subSection} = currentContent;
  originalAppendix = storage.getAppendix(part, chapter, section, subSection);
  
  const appendixDiv = document.getElementById('appendixContent');
  const cardInner = document.getElementById('cardInner');
  cardInner.classList.add('editing');
  appendixDiv.classList.add('editing');
  appendixDiv.innerHTML = `<textarea class="edit-textarea" id="appendixTextarea">${originalAppendix}</textarea>`;
  
  const footer = appendixDiv.parentElement.querySelector('.card-footer');
  footer.innerHTML = `
    <div class="edit-buttons" style="width:100%">
      <button class="edit-btn cancel" onclick="cancelEditAppendix()">취소</button>
      <button class="edit-btn save" onclick="saveAppendix()">저장</button>
    </div>
  `;
  
  document.getElementById('appendixTextarea').focus();
}

function cancelEditAppendix() {
  isEditingAppendix = false;
  renderCard();
  setTimeout(() => flipCard(), 100);
}

function saveAppendix() {
  const newAppendix = document.getElementById('appendixTextarea').value;
  const {part, chapter, section, subSection} = currentContent;
  storage.saveAppendix(part, chapter, section, subSection, newAppendix);
  isEditingAppendix = false;
  renderCard();
  setTimeout(() => flipCard(), 100);
}

function toggleReadStatus() {
  const {part, chapter, section, subSection} = currentContent;
  storage.toggleRead(part, chapter, section, subSection);
  renderCard();
}

// ============ 댓글 모달 ============
function openCommentModal() {
  const {part, chapter, section, subSection} = currentContent;
  const comments = storage.getComments(part, chapter, section, subSection);
  
  let html = '';
  comments.forEach(comment => {
    const date = new Date(comment.created).toLocaleString('ko-KR');
    html += `
      <div class="comment-item">
        <div class="comment-text">${comment.text}<br><small style="opacity:0.7">${date}</small></div>
        <button class="delete-btn" onclick="deleteComment(${comment.id})">삭제</button>
      </div>
    `;
  });
  
  if (html === '') {
    html = '<div style="text-align:center;padding:20px;color:#999">댓글이 없습니다</div>';
  }
  
  document.getElementById('commentList').innerHTML = html;
  document.getElementById('newComment').value = '';
  document.getElementById('commentModal').classList.add('show');
}

function closeCommentModal() {
  document.getElementById('commentModal').classList.remove('show');
}

function submitComment() {
  const text = document.getElementById('newComment').value.trim();
  if (!text) {
    alert('댓글을 입력하세요');
    return;
  }
  
  const {part, chapter, section, subSection} = currentContent;
  storage.addComment(part, chapter, section, subSection, text);
  openCommentModal();
  renderCard();
}

function deleteComment(id) {
  const {part, chapter, section, subSection} = currentContent;
  storage.deleteComment(part, chapter, section, subSection, id);
  openCommentModal();
  renderCard();
}

// ============ 북마크 모달 ============
function openBookmarkModal() {
  const groups = storage.getBookmarkGroups();
  const {part, chapter, section, subSection} = currentContent;
  const bookmarkedGroups = storage.isBookmarked(part, chapter, section, subSection);
  
  let html = '';
  groups.forEach(group => {
    const isBookmarked = bookmarkedGroups.includes(group);
    html += `
      <div class="checkbox-item" onclick="toggleBookmark('${group.replace(/'/g, "\\'")}')">
        <input type="checkbox" ${isBookmarked ? 'checked' : ''} style="pointer-events:none">
        <span>${group}</span>
      </div>
    `;
  });
  
  document.getElementById('bookmarkGroupList').innerHTML = html;
  document.getElementById('bookmarkModal').classList.add('show');
}

function closeBookmarkModal() {
  document.getElementById('bookmarkModal').classList.remove('show');
}

function addNewBookmarkGroup() {
  const name = document.getElementById('newBookmarkGroup').value.trim();
  if (!name) {
    alert('그룹 이름을 입력하세요');
    return;
  }
  
  const groups = storage.getBookmarkGroups();
  if (groups.includes(name)) {
    alert('이미 존재하는 그룹입니다');
    return;
  }
  
  storage.addBookmarkGroup(name);
  document.getElementById('newBookmarkGroup').value = '';
  openBookmarkModal();
}

function toggleBookmark(groupName) {
  const {part, chapter, section, subSection} = currentContent;
  const bookmarks = storage.getBookmarks(groupName);
  const exists = bookmarks.some(b => b.part === part && b.chapter === chapter && b.section === section && b.subSection === subSection);
  
  if (exists) {
    storage.removeBookmark(groupName, part, chapter, section, subSection);
  } else {
    storage.addBookmark(groupName, part, chapter, section, subSection);
  }
  
  openBookmarkModal();
  renderCard();
}

// ============ 북마크 그룹 관리 ============
function showBookmarkGroups() {
  const groups = storage.getBookmarkGroups();
  if (groups.length === 0) {
    document.getElementById('mainContainer').innerHTML = '<div class="no-data">등록된 북마크 그룹이 없습니다</div>';
    return;
  }
  
  let html = '<div class="page-container"><h2 style="margin-bottom:20px">북마크 그룹</h2>';
  groups.forEach((group, index) => {
    const bookmarks = storage.getBookmarks(group);
    const escapedGroup = group.replace(/'/g, "\\'");
    html += `
      <div class="bookmark-item-container">
        <div class="bookmark-item-name" onclick="selectBookmarkGroup('${escapedGroup}')">${group} (${bookmarks.length})</div>
        <div class="bookmark-item-buttons">
          <button class="image-move-btn" onclick="moveBookmarkUp(${index})" ${index === 0 ? 'disabled' : ''}>▲</button>
          <button class="image-move-btn" onclick="moveBookmarkDown(${index})" ${index === groups.length - 1 ? 'disabled' : ''}>▼</button>
          <button class="bookmark-edit-btn" onclick="editBookmarkGroup('${escapedGroup}')">수정</button>
          <button class="bookmark-delete-btn" onclick="deleteBookmarkGroup('${escapedGroup}')">삭제</button>
        </div>
      </div>
    `;
  });
  html += '</div>';
  document.getElementById('mainContainer').innerHTML = html;
}

function selectBookmarkGroup(groupName) {
  currentBookmarkGroup = groupName;
  currentMode = 'all';
  applyFilters();
}

function editBookmarkGroup(oldName) {
  document.getElementById('renameBookmarkInput').value = oldName;
  document.getElementById('renameBookmarkInput').dataset.oldName = oldName;
  document.getElementById('renameBookmarkModal').classList.add('show');
  setTimeout(() => {
    document.getElementById('renameBookmarkInput').focus();
    document.getElementById('renameBookmarkInput').select();
  }, 100);
}

function closeRenameBookmarkModal() {
  document.getElementById('renameBookmarkModal').classList.remove('show');
}

function confirmRenameBookmark() {
  const input = document.getElementById('renameBookmarkInput');
  const oldName = input.dataset.oldName;
  const newName = input.value.trim();
  
  if (!newName) {
    alert('그룹 이름을 입력하세요');
    return;
  }
  
  if (newName === oldName) {
    closeRenameBookmarkModal();
    return;
  }
  
  const groups = storage.getBookmarkGroups();
  if (groups.includes(newName)) {
    alert('이미 존재하는 그룹 이름입니다');
    return;
  }
  
  storage.renameBookmarkGroup(oldName, newName);
  closeRenameBookmarkModal();
  showBookmarkGroups();
}

function deleteBookmarkGroup(groupName) {
  const bookmarks = storage.getBookmarks(groupName);
  const message = bookmarks.length > 0
    ? `"${groupName}" 그룹에 ${bookmarks.length}개의 북마크가 있습니다.\n정말 삭제하시겠습니까?`
    : `"${groupName}" 그룹을 삭제하시겠습니까?`;
  
  if (confirm(message)) {
    storage.deleteBookmarkGroup(groupName);
    showBookmarkGroups();
  }
}

function moveBookmarkUp(index) {
  if (index > 0) {
    storage.reorderBookmarkGroups(index, index - 1);
    showBookmarkGroups();
  }
}

function moveBookmarkDown(index) {
  const groups = storage.getBookmarkGroups();
  if (index < groups.length - 1) {
    storage.reorderBookmarkGroups(index, index + 1);
    showBookmarkGroups();
  }
}

// ============ 통계 ============
function showStats() {
  const html = `
    <div class="page-container">
      <h2 style="margin-bottom:20px">통계</h2>
      <select class="stat-unit-selector" id="statUnitSelector" onchange="updateStats()">
        <option value="part">Part 단위</option>
        <option value="chapter">Chapter 단위</option>
      </select>
      <div id="statsContent"></div>
    </div>
  `;
  document.getElementById('mainContainer').innerHTML = html;
  updateStats();
}

function updateStats() {
  const unit = document.getElementById('statUnitSelector').value;
  let stats = [];
  
  if (unit === 'part') {
    PART_LIST.forEach(part => {
      const partContents = CONTENTS.filter(c => c.part === part.part);
      let todayCount = 0;
      let weekCount = 0;
      
      partContents.forEach(content => {
        if (storage.isReadToday(content.part, content.chapter, content.section, content.subSection)) {
          todayCount++;
        }
        if (storage.isReadThisWeek(content.part, content.chapter, content.section, content.subSection)) {
          weekCount++;
        }
      });
      
      stats.push({
        name: `${part.part} - ${part.name}`,
        total: partContents.length,
        today: todayCount,
        week: weekCount
      });
    });
  } else {
    CHAPTER_LIST.forEach(chapter => {
      const chapterContents = CONTENTS.filter(c => 
        c.part === chapter.part && c.chapter == chapter.chapter
      );
      let todayCount = 0;
      let weekCount = 0;
      
      chapterContents.forEach(content => {
        if (storage.isReadToday(content.part, content.chapter, content.section, content.subSection)) {
          todayCount++;
        }
        if (storage.isReadThisWeek(content.part, content.chapter, content.section, content.subSection)) {
          weekCount++;
        }
      });
      
      stats.push({
        name: `${chapter.part}.${chapter.chapter} - ${chapter.name}`,
        total: chapterContents.length,
        today: todayCount,
        week: weekCount
      });
    });
  }
  
  let html = '<table class="stats-table"><thead><tr><th>구분</th><th>전체</th><th>오늘</th><th>이번주</th></tr></thead><tbody>';
  stats.forEach(stat => {
    html += `<tr><td>${stat.name}</td><td>${stat.total}</td><td>${stat.today}</td><td>${stat.week}</td></tr>`;
  });
  html += '</tbody></table>';
  
  document.getElementById('statsContent').innerHTML = html;
}

// ============ UI 토글 ============
function toggleSidebar() {
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.querySelector('.sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

function toggleTheme() {
  const current = document.body.className;
  const newTheme = current === 'dark' ? 'light' : 'dark';
  document.body.className = newTheme;
  localStorage.setItem(STORAGE_PREFIX + 'theme', newTheme);
  document.querySelector('.theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

function toggleTitleMode() {
  titleMode = titleMode === 'name' ? 'id' : 'name';
  localStorage.setItem(STORAGE_PREFIX + 'titleMode', titleMode);
  document.getElementById('titleModeBtn').textContent = titleMode === 'name' ? '名' : '#';
  renderCard();
}

// ============ 초기 실행 ============
window.addEventListener('DOMContentLoaded', init);
</script>
